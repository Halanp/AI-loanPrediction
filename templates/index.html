<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Eligibility Predictor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center; 
            padding: 40px; 
            color: #2c3e50;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 { 
            color: #2c3e50; 
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        form { 
            background: #fff; 
            padding: 50px 60px; 
            display: inline-block; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
        }
        
        input, select { 
            padding: 14px; 
            margin: 12px; 
            width: 280px; 
            border-radius: 8px; 
            border: 1px solid #ddd;
            font-size: 16px;
            background: #f8f9fa;
            color: #2c3e50;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: white;
        }
        
        button { 
            padding: 14px 35px; 
            background: linear-gradient(to right, #3498db, #2c3e50); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        button:hover { 
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        #creditValue { 
            font-weight: bold; 
            color: #e74c3c; 
            font-size: 18px;
        }
        
        label {
            color: #2c3e50;
            font-weight: 600;
            font-size: 16px;
            display: block;
            margin-top: 15px;
        }
        
        .credit-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        input[type="range"] {
            width: 80%;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
        }
        
        @media (max-width: 768px) {
            form {
                padding: 30px 20px;
                width: 95%;
            }
            
            input, select {
                width: 90%;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Loan Eligibility Predictor</h1>
        <form action="/predict" method="post" onsubmit="convertCreditValue()">
            <div class="form-row">
                <div class="form-group">
                    <select name="gender" required>
                        <option value="">Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <select name="married" required>
                        <option value="">Married</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <select name="dependents" required>
                        <option value="">Dependents</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3+">3+</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <select name="education" required>
                        <option value="">Education</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Not Graduate">Not Graduate</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <select name="employed" required>
                        <option value="">Self Employed</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <select name="area" required>
                        <option value="">Property Area</option>
                        <option value="Rural">Rural</option>
                        <option value="Semiurban">Semiurban</option>
                        <option value="Urban">Urban</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <input type="number" name="ApplicantIncome" placeholder="Applicant Income" required>
                </div>
                
                <div class="form-group">
                    <input type="number" name="CoapplicantIncome" placeholder="Coapplicant Income" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <input type="number" name="LoanAmount" placeholder="Loan Amount" required>
                </div>
                
                <div class="form-group">
                    <input type="number" name="Loan_Amount_Term" placeholder="Loan Term (days)" required>
                </div>
            </div>
            
            <div class="credit-section">
                <label for="creditSlider">Credit Score (0 - 1000):</label><br>
                <input type="range" id="creditSlider" name="creditSlider" min="0" max="1000" value="500" oninput="updateCreditValue(this.value)"><br>
                <p>Credit Score: <span id="creditValue">500</span></p>
                <input type="hidden" id="credit" name="credit" value="0">
            </div>
            
            <button type="submit">Check Eligibility</button>
        </form>
    </div>
    
    <script>
        function updateCreditValue(value) {
            document.getElementById("creditValue").textContent = value;
        }
        
        function convertCreditValue(){
            const creditScore = parseInt(document.getElementById('creditSlider').value);
            const creditBinary = (creditScore >= 850 && creditScore <= 1000 ) ? 1 : 0;
            document.getElementById('credit').value = creditBinary;
        }
    </script>
</body>
</html>
