<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Prediction Result</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            padding: 40px;
            color: #2c3e50;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .result-box {
            background: white;
            padding: 50px 40px;
            display: inline-block;
            border-radius: 5px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        p {
            font-size: 20px;
            color: #333;
            margin: 25px 0;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: white;
            background: linear-gradient(to right, #3498db, #2c3e50);
            padding: 14px 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .result-box {
                padding: 30px 20px;
                width: 90%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-box">
            <h1>Loan Eligibility Result</h1>
            <p>{{ prediction_text }}</p>
            <a href="index">Go Back</a>
        </div>
    </div>
</body>
</html>
